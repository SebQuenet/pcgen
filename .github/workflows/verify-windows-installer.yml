name: Verify Windows installer

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set release metadata
        shell: bash
        run: |
          PROPS_FILE="code/src/resources/pcgen/system/prop/PCGenProp.properties"
          GRADLE_VERSION=$(grep '^version=' gradle.properties | head -1 | cut -d'=' -f2 | tr -d '[:space:]')
          RELEASE_DATE=$(date -u +%Y-%m-%d)
          sed -i.bak "s/^VersionNumber=.*/VersionNumber=${GRADLE_VERSION}/" "${PROPS_FILE}"
          sed -i.bak "s/^ReleaseDate=.*/ReleaseDate=${RELEASE_DATE}/" "${PROPS_FILE}"
          rm -f "${PROPS_FILE}.bak"

      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: temurin
          cache: gradle
          cache-dependency-path: |
            build.gradle
            code/gradle/autobuild.gradle
            code/gradle/distribution.gradle
            code/gradle/release.gradle
            code/gradle/reporting.gradle
            code/gradle/plugins.gradle

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: false
          cache-read-only: false
          cache-overwrite-existing: true

      - uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/build/jre
            ${{ github.workspace }}/build/libs
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle

      - name: Install WiX
        run: choco install wixtoolset --no-progress -y

      - name: Build release artifacts
        run: ./gradlew clean build copyToOutput test compileSlowtest datatest pfinttest allReports buildDist prepareRelease pcgenRelease

      - name: Verify MSI
        shell: pwsh
        run: |
          $msi = @(Get-ChildItem -Path build/release/*.msi -ErrorAction Stop)
          if ($msi.Count -ne 1 -or $msi[0].Length -eq 0) {
            throw 'Expected one non-empty MSI in build/release'
          }
          Write-Host "$($msi[0].Name): $($msi[0].Length) bytes"

      # The previous version must have a lower numeric version, or the MSI is not an upgrade.
      # It is the latest published release: each release replaces the one before it.
      - name: Keep characters across an upgrade
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $env:PREVIOUS_RELEASE = gh release view --repo $env:GITHUB_REPOSITORY --json tagName --jq .tagName
          if (-not $env:PREVIOUS_RELEASE) { throw 'No published release to upgrade from' }
          Write-Host "Upgrading from $env:PREVIOUS_RELEASE"
          gh release download $env:PREVIOUS_RELEASE --repo $env:GITHUB_REPOSITORY --pattern '*.msi' --dir previous-msi
          $previousMsi = (Get-ChildItem previous-msi/*.msi).FullName
          $currentMsi = (Get-ChildItem build/release/*.msi).FullName
          $installDirectory = 'C:\PcGenUpgradeTest'

          $previousInstall = Start-Process msiexec -Wait -PassThru -ArgumentList "/i `"$previousMsi`" /qn INSTALLDIR=$installDirectory /l*v previous-install.log"
          if ($previousInstall.ExitCode -ne 0) { throw "Installing $env:PREVIOUS_RELEASE failed: $($previousInstall.ExitCode)" }
          $savedCharacter = Join-Path $installDirectory 'app\characters\Upgrade Witness.pcg'
          Set-Content -Path $savedCharacter -Value 'saved before the upgrade'

          $upgrade = Start-Process msiexec -Wait -PassThru -ArgumentList "/i `"$currentMsi`" /qn /l*v upgrade.log"
          if ($upgrade.ExitCode -ne 0) { throw "Upgrading failed: $($upgrade.ExitCode)" }

          $keptCharacter = Join-Path ([Environment]::GetFolderPath('MyDocuments')) 'PCGen\characters\Upgrade Witness.pcg'
          if (-not (Test-Path $keptCharacter)) { throw "The upgrade lost $savedCharacter" }
          Write-Host "Kept: $keptCharacter"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-installer-logs
          path: '*.log'
          if-no-files-found: ignore
          retention-days: 1

      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer-preview
          path: build/release/*.msi
          if-no-files-found: error
          retention-days: 1
